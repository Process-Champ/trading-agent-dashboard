name: Run Momentum Trading Scanner

on:
  schedule:
    # Runs at 10:30 AM UTC (which is exactly 4:00 PM IST) Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # This allows you to click a button and run it manually anytime

jobs:
  scan-market:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests gspread google-auth

    - name: Hydrate Google Credentials from Secret Vault
      run: |
        # CHANGED: Now matches your existing secret name perfectly
        echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" > service_account.json

    - name: Execute Agent Script
      run: python trading_agent.py
