name: Run Momentum Trading Scanner

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan-market:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests gspread google-auth

    - name: Hydrate Google Credentials from Secret Vault
      run: |
        cat << 'EOF' > service_account.json
        ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        EOF

    - name: Execute Agent Script
      run: python trading_agent.py
